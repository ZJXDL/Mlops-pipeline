name: MLOps CI/CD & Continuous Retraining Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Trigger automated retraining every Monday at midnight UTC
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Data Preprocessing & Training
      env:
        MLFLOW_ALLOW_FILE_STORE: "true"
      run: |
        python src/preprocess.py
        python src/train.py

    - name: Run Unit Tests
      env:
        PYTHONPATH: .
      run: |
        python -m pytest

    - name: Run Data Drift Monitoring
      run: |
        python src/monitor.py

    - name: Upload Drift Report Artifact
      uses: actions/upload-artifact@v4
      with:
        name: data-drift-report
        path: reports/data_drift_report.html

    - name: Convert repository name to lowercase
      run: |
        echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

    - name: Log in to GitHub Container Registry
      if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule')
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and Push Docker Image
      if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule')
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: |
          ghcr.io/${{ env.IMAGE_NAME }}:latest
          ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}